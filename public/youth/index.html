<main><a href="/">월세각 홈</a><h1>청년 첫 독립 도우미</h1><p>살고 싶은 지역의 공공임대 공고와 실제 월세 계약을 내 예산으로 비교하세요.</p>
<form id="filters"><div class="fields"><label>시도<select id="province" required></select></label><label>시군구<select id="district" required></select></label><label>보증금 한도 (만원)<input id="deposit" type="number" value="1000" min="0" required></label><label>월세 한도 (만원)<input id="rent" type="number" value="60" min="0" required></label><label>주택 유형<select id="type"><option>원/투룸</option><option>연립·다세대</option><option>오피스텔</option><option>아파트</option></select></label><label>면적 상한 (㎡)<input id="size" type="number" value="33" min="1" required></label></div><button>조건 반영하기</button></form>
<section><h2>신청할 집</h2><p id="noticeStatus" role="status"></p><details open><summary>공급 단지 지도</summary><div id="housingMap"></div></details><div id="notices"></div><a id="lh" href="https://apply.lh.or.kr/">LH 공고 더 보기</a> · <a href="https://m.myhome.go.kr/hws/portal/sch/selectRsdtRcritNtcView.do">마이홈 모집공고</a></section>

<script>
const $=id=>document.getElementById(id);
let regions=[],generation=0;
async function json(url){const r=await fetch(url);if(!r.ok)throw Error();return r.json()}
function districts(){const list=regions.filter(r=>r.name.split(' ')[0]===$('province').value);$('district').replaceChildren(...list.map(r=>new Option(r.name.split(' ').slice(1).join(' ')||r.name,r.code)))}
function item(tag,label){const el=document.createElement(tag);el.textContent=label;return el}
async function showNotices(region,province,seq){
 const code=province.startsWith('세종')?'36110':region.code.slice(0,2);
 $('lh').href='https://apply.lh.or.kr/lhapply/apply/wt/wrtanc/selectWrtancList.do?mi=1026';
 let list,cached=false;
 try{list=await json('/api/youth-notices?region='+code)}catch{list=SNAPSHOT;cached=true}
 if(seq!==generation)return;
 const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'}).replaceAll('-','.');
 const active=list.filter(n=>(n.region===province||n.region==='전국') && /^\d{4}\.\d{2}\.\d{2}$/.test(n.end)&&n.end>=today&&!/마감|종료/.test(n.status));
 const city=region.name.split(' ')[1]?.replace(/[시군구]$/,'');
 if(city)active.sort((a,b)=>Number(b.title.includes(city))-Number(a.title.includes(city)));
 $('noticeStatus').textContent=province+' 및 전국 공고 · '+(cached?'11월 28일 확인 자료':'LH 공고 목록 기준')+' · '+(active.length?active.length+'건. 정확한 공급 주소와 접수 시작·마감 시간은 원문에서 확인하세요.':'표시할 공고가 없습니다. 공식 목록에서 추가 모집을 확인하세요.');
 const directory=await youthDirectory; if(seq!==generation)return;
 const visible=active.slice(0,12);
 showHousingMap($('housingMap'),visible.map(n=>directory.find(d=>noticeId(d)===noticeId(n))||n),province);
 for(const n of visible){
 const card=item('article',''),link=item('a',n.title);link.href=n.url;const title=item('h3','');title.append(link);card.append(title,item('p',n.region+' · '+n.status+' · 게시 '+n.posted+' · 공고 마감 '+n.end));
 const summary=item('a','공고 요약·지도 보기'); summary.href=summaryUrl(n);summary.onclick=()=>rememberNotice(n); const original=item('a','LH 원문 바로가기');original.href=n.url;card.append(summary,' · ',original);
 const details=item('details','');details.append(item('summary','확인할 자격과 서류 · 원문 확인 필요'));
 for(const t of ['청년 연령·기준일','무주택 판정 범위','소득·자산 기준','제출 서류와 접수 일정']){const label=item('label','');const box=document.createElement('input');box.type='checkbox';label.append(box,' '+t);details.append(label)}card.append(details);
 const save=item('button','공고 저장');const key='youth-notice:'+n.url;try{if(localStorage.getItem(key))save.textContent='저장 해제'}catch{}save.onclick=()=>{try{if(localStorage.getItem(key)){localStorage.removeItem(key);save.textContent='공고 저장'}else{localStorage.setItem(key,n.title);save.textContent='저장 해제'}}catch{save.textContent='이 기기에 저장할 수 없어요'}};card.append(save);$('notices').append(card)}
}
async function apply(){
 const seq=++generation,region=regions.find(r=>r.code===$('district').value);if(!region)return;
 const type=$('type').selectedIndex,size=Number($('size').value),dep=Number($('deposit').value),rent=Number($('rent').value);
 $('housingMap').replaceChildren();$('deals').replaceChildren();$('notices').replaceChildren();$('summary').textContent=$('noticeStatus').textContent='불러오는 중…';showNotices(region,$('province').value,seq);
 try{const d=await json('/data/sgg/'+region.code+'.json');if(seq!==generation)return;
 const rows=d.rows.filter(r=>r[0]===type&&r[2]>0&&r[2]<=size&&r[4]>0).sort((a,b)=>b[7]-a[7]);const fits=r=>r[3]<=dep&&r[4]<=rent;
 $('summary').textContent=region.name+' · '+d.updated+' 갱신 · 같은 조건의 월세 '+rows.length.toLocaleString()+'건 중 예산 이내 '+rows.filter(fits).length.toLocaleString()+'건. 최근 계약 최대 10건을 표시합니다.';
 for(const r of rows.slice(0,10)){const tr=item('tr','');const date=String(r[7]).padStart(6,'0');for(const v of [date.match(/../g).join('.'),d.dongs[r[1]],r[2]+'㎡',r[3].toLocaleString()+' / '+r[4],fits(r)?'이내':'초과'])tr.append(item('td',v));$('deals').append(tr)}
 }catch{if(seq===generation)$('summary').textContent='실거래를 불러오지 못했습니다. 다시 반영해 주세요.'}
}
$('province').onchange=districts;$('filters').onsubmit=e=>{e.preventDefault();apply()};
