<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>월세각 방문 통계</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#fff8f3;--card:#fff;--ink:#1f1a17;--sub:#6d635c;--line:#efe3da;--soft:#fff1e8;--brand:#ff6b3d;--brand-ink:#c2410c;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:820px;margin:0 auto;padding:24px 16px 60px}
h1{margin:0 0 4px;font-size:24px}
h2{margin:0 0 12px;font-size:17px}
p.sub,.note{color:var(--sub);font-size:14px;line-height:1.6;margin:0 0 16px}
a{color:var(--brand-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:14px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.kpi span{font-size:12.5px;color:var(--sub)}
.kpi b{font-size:24px;line-height:1.2}
.kpi em{font-style:normal;font-size:12.5px;color:var(--sub)}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-top:8px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.col i{display:block;width:100%;background:var(--brand);border-radius:3px 3px 0 0}
.col.c i{background:#2563eb}
.col .n{font-size:10px;color:var(--sub);margin-bottom:2px}
.grp{flex:1;min-width:0;display:flex;gap:1px;height:100%;position:relative}
.dl{position:absolute;bottom:-18px;left:0;font-size:10px;color:var(--sub);white-space:nowrap}
ol{margin:0;padding:0;list-style:none}
li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
li b{flex:none}
li:last-child{border-bottom:0}
.empty{color:var(--sub)}
@media(max-width:600px){.col .n{display:none}}
</style>
</head>
<body>
<main>
  <h1>월세각 방문 통계</h1>
  <p class="sub">쿠키 없이 센 조회수와 방문자 수, 「매물 검증하기」를 누른 횟수입니다. 같은 브라우저는 하루에 한 번만 방문자로 세고, 날짜는 한국 시간 기준입니다. 내 방문을 빼려면 <b>주소 뒤에 ?nocount=1</b>을 붙여 한 번 열어 두세요.</p>
  <p id="msg" class="note" role="status">불러오는 중…</p>
  <div id="body" hidden>
    <div class="card"><h2>방문</h2><div class="kpis" id="kpis"></div></div>
    <div class="card"><h2>매물 검증 횟수</h2><div class="kpis" id="ckpis"></div></div>
    <div class="card"><h2>최근 30일</h2><p class="note" style="margin:0">주황 막대 = 조회수(위 숫자 = 방문자), 파랑 막대 = 매물 검증</p><div class="chart" id="chart"></div></div>
    <div class="card"><h2>많이 검증한 지역 <span class="note">(최근 30일)</span></h2><ol id="places"></ol></div>
  </div>
</main>
<script>
(async function () {
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return Number(n).toLocaleString('ko-KR'); };
  var s, idx;
  try {
    var r = await Promise.all([
      fetch('/api/visits', { cache: 'no-store' }).then(function (x) { if (!x.ok) throw 0; return x.json(); }),
      fetch('/data/index.json').then(function (x) { return x.json(); }).catch(function () { return { sgg: [] }; }),
    ]);
    s = r[0]; idx = r[1];
  } catch (e) { $('msg').textContent = '통계를 불러오지 못했어요. Cloudflare Pages에 D1 데이터베이스(변수 이름 STATS_DB)를 연결해야 해요.'; return; }
  $('msg').hidden = true; $('body').hidden = false;
  $('kpis').innerHTML = [['오늘', s.today], ['어제', s.yesterday], ['최근 7일', s.d7], ['최근 30일', s.d30], ['전체', s.all]].map(function (c) {
    return '<div class="kpi"><span>' + c[0] + '</span><b>' + fmt(c[1].views) + '</b><em>방문자 ' + fmt(c[1].uniques) + '</em></div>';
  }).join('');
  $('ckpis').innerHTML = [['오늘', s.checks.today], ['최근 7일', s.checks.d7], ['최근 30일', s.checks.d30], ['전체', s.checks.all]].map(function (c) {
    return '<div class="kpi"><span>' + c[0] + '</span><b>' + fmt(c[1]) + '</b><em>회</em></div>';
  }).join('');
  var vm = {}, cm = {};
  s.daily.forEach(function (x) { vm[x.day] = x; }); s.checksDaily.forEach(function (x) { cm[x.day] = x.n; });
  var t = new Date(s.today_day + 'T00:00:00Z'), days = [];
  for (var i = 29; i >= 0; i--) { var d = new Date(t - i * 864e5).toISOString().slice(0, 10); days.push({ day: d, v: (vm[d] || {}).views || 0, u: (vm[d] || {}).uniques || 0, c: cm[d] || 0 }); }
  var max = Math.max.apply(null, days.map(function (x) { return Math.max(x.v, x.c); }).concat([1]));
  var bar = function (n, cls, u) { return '<div class="col ' + cls + '"><span class="n">' + (u || '') + '</span><i style="height:' + Math.max(n / max * 100, n ? 3 : 0) + '%"></i></div>'; };
  $('chart').innerHTML = days.map(function (x, i) {
    return '<div class="grp" title="' + x.day + ' · 조회 ' + x.v + ' · 방문자 ' + x.u + ' · 검증 ' + x.c + '">' + bar(x.v, '', x.u) + bar(x.c, 'c') + (i % 5 === 4 || i === 0 ? '<span class="dl">' + x.day.slice(5).replace('-', '/') + '</span>' : '') + '</div>';
  }).join('');
  var names = {}; (idx.sgg || []).forEach(function (g) { names[g.code] = g.name; });
  $('places').innerHTML = s.topPlaces.length ? s.topPlaces.map(function (r) {
    var p = r.label.split('|'); return '<li><span>' + (names[p[0]] || p[0]) + ' · ' + (p[1] === 'jeonse' ? '전세' : '월세') + '</span><b>' + fmt(r.n) + '회</b></li>';
  }).join('') : '<li class="empty">아직 기록이 없어요.</li>';
})();
</script>
</body>
</html>
