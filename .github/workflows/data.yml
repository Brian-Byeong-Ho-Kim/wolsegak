name: 실거래 데이터 갱신
on:
  schedule:
    - cron: '43 19 * * 0'   # 매주 월요일 04:43 KST
  workflow_dispatch:
    inputs:
      only:
        description: '일부 시군구만 (쉼표로 구분, 비우면 전국)'
        required: false
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 데이터 받기
        run: node scripts/build.mjs ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 변경 시 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || (git commit -m "실거래 데이터 갱신 $(date -u +%F)" && git push)
